<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAKAS CAIR - Lacak Berkas Pencairan BPKAD Kab. HSU</title>
<style>
  html,body{margin:0;height:100%;background:#fff}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="f" title="LAKAS CAIR" allow="clipboard-write"></iframe>
<noscript>Aktifkan JavaScript, atau buka tautan resmi dari BPKAD Kab. HSU.</noscript>
<script>
  // URL aplikasi web (berakhiran /exec) dari Apps Script > Kelola deployment
  var TUJUAN = 'https://script.google.com/macros/s/AKfycbzdya4uNM1fF3fuUkBlxuAFVOqe4ADlu0VUTSeF9OgrZmu0QuJY8NTuNDsr9DV6Ds8mlg/exec';
  var f = document.getElementById('f');
  function buka(no) {
    f.src = TUJUAN + (no ? '?berkas=' + encodeURIComponent(no) : '');
    try { history.replaceState(null, '', no ? '?berkas=' + encodeURIComponent(no) : location.pathname); } catch (e) {}
  }
  var q = new URLSearchParams(location.search);
  buka(q.get('berkas') || q.get('noreg') || '');
  // Pencarian ulang dari dalam halaman: alamat tetap bpkad-hsu.github.io/lakas
  window.addEventListener('message', function (ev) {
    if (ev.data && typeof ev.data.lakas === 'string') buka(ev.data.lakas.replace(/[^0-9]/g, '').slice(0, 6));
  });
</script>
</body>
</html>
